<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>だいこんさーばー</title>
    <link rel="icon" href="icon.png" type="image/png" />
    <meta property="og:title" content="大根サーバー" />
    <meta property="og:description" content="大根サーバーの公式サイトです。" />
    <meta property="og:url" content="https://www.daikonsv.f5.si/" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="assets/script.js" defer></script>
  </head>
  <body>
    <header>
      <button id="hamburger">&#9776;</button>
      <nav id="nav-links">
        <a href="/"><img src="/assets/icon.png" /></a>
        <a href="/">Home</a>
        <a href="/play">Play</a>
        <a href="/rule">Rule</a>
        <a href="/news">News</a>
        <a href="/faq">FAQ</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>
    <main>
      <h1>サーバーのルール</h1>
      <h2>規約</h2>
      <ul class="rules"></ul>
      <script>
        const rules = [
          {
            cat: "カテゴリー",
            items: [
              {
                k: "ルール違反行為や、安全を脅かされるように感じる場面を見かけたら、モデレーターまたは管理者にご報告ください。",
                t: "warn",
              },
              {
                k: "年齢制限のあるコンテンツやわいせつなコンテンツは禁止されています。これには裸体・性行為・ハードな暴力シーンなどを描いた文章・画像・リンク、そのほか見た人を不快にさせる露骨なコンテンツが含まれます。",
                t: "ban",
              },
              {
                k: "当サーバーではひなグローバルチャットを導入しています。このグローバルチャット内でのルール・規約にご同意いただいた上でご利用ください。",
                t: "warn",
              },
              {
                k: "当サーバーでは安全なサーバーにすることを心がけております。上記規約１・２にご同意いただけない場合はご参加をご遠慮ください。",
                t: "ban",
              },
              {
                k: "身分を当サーバーで紹介等を行った場合は、サーバー管理者・オーナーは一切責任を追うことは不可能です。ご了承ください。",
                t: "ban",
              },
              {
                k: "こちらのサーバーでは連携等を行っておりますが、もし、荒らしなどのサーバーでしたら連携は不可能です。",
                t: "ban",
              },
              {
                k: "もし、喧嘩などの行為が発覚した場合は、サーバー主または管理者・モデレーターの指示等に従っていただけますようお願い申し上げます。",
                t: "warn",
              },
            ],
          },
          {
            cat: "Mincraftサーバー規約",
            items: [
              {
                k: "当サーバーではJAVA・統合版クロス参加システムを導入しております。統合版は多少のラグがあります。ご了承ください。",
                t: "warn",
              },
              {
                k: "当サーバーの禁止行為<br>　　I　X-Layなどのチート行為<br>　　II　他のプレイヤー等が不利になる行為<br>　　III　サーバーチャットの中で他のプレイヤーが不快に思う発言<br>　　IV　他プレイヤーが作成した建造物または技術等を破壊・改変行為<br>　　上記のI II III IVにご同意いただけない場合は参加をご遠慮していただいております。ご了承ください。",
                t: "ban",
              },
              {
                k: "Minecraftの利用規約のご同意願います。もし、ご同意いただけない場合は参加をご遠慮いただいております。",
                t: "warn",
              },
              {
                k: "当サーバーは、Minecraftサーバーにご参加の際に、Microsoft社のゲーマータグが必要になります。もし、お持ちでない場合は、Microsoftアカウントを作成いただけますと幸いです。",
                t: "warn",
              },
            ],
          },
        ];
        const ul = document.querySelector(".rules");

        for (const cat of rules) {
          const catLi = document.createElement("li");
          catLi.className = "cat";
          catLi.innerHTML = `<h3>${cat.cat}</h3>`;

          const innerUl = document.createElement("ul");
          for (const item of cat.items) {
            const li = document.createElement("li");
            li.className = `rule ${"type_" + item.t ?? ""}`.trim();
            li.innerHTML = `
    <span class="k">${item.k}</span>
  `;
            innerUl.appendChild(li);
          }
          catLi.appendChild(innerUl);
          ul.appendChild(catLi);
        }
      </script>
    </main>
    <noscript>
      なんらかのscriptが無効化されているため、不具合が出る場合があります。
    </noscript>
  </body>
</html>
